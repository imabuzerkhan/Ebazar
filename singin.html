<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="Singin.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <a href="index.html">EBOOZAR</a>
            <h2>Welcome to login</h2>
            <p>Don't have an account?</p>
            <a href="Singup.html" class="signup-btn">Sign Up</a>
        </div>
        <div class="right">
            <div class="social-icons">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>   </div>
                <div class="new-right">
                    <div class="login-box">
                        <h2>Sign In</h2>
                        <form>
                            <label for="username">User Name</label>
                            <input class="input-box" type="text" id="username" placeholder="User Name" required>
        
                            <label for="password">Password</label>
                            <input class="input-box" type="password" id="password" placeholder="Password" required>
        
                            <div class="remember">
                                <input type="checkbox" id="remember"><label for="remember">Remember</label>
                            </div>
        
                            <button type="submit" class="signin-btn">Sign In</button>
                            <a href="#" class="forgot-password">Forgot Password?</a>
                        </form>
        
                       
                    </div>
                </div>
          
            
        </div>
    </div>
</body>
</html>
