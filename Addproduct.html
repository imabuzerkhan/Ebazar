<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebozar Product Form</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="Addproduct.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h1><i class="fas fa-store"></i> Ebozar</h1>
            <nav>
                <ul>
                    <li><a href="#"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                    <li class="active"><a href="#"><i class="fas fa-box"></i> Products</a></li>
                    <li><a href="#"><i class="fas fa-file-alt"></i> Report</a></li>
                    <li><a href="#"><i class="fas fa-exclamation-triangle"></i> Warnings</a></li>
                    <li><a href="#"><i class="fas fa-user"></i> My Account</a></li>
                </ul>
            </nav>
            <button class="logout"> Log Out</button>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <!-- Header -->
            <header class="header">
                <div class="profile">
                    <img src="images/product 5.png" alt="User Image">
                    <span>MD ARYAN ALAM</span>
                </div>
                <div class="cart">
                    <span><i class="fas fa-shopping-cart"></i> Cart</span>
                    <button class="location-btn"><i class="fas fa-map-marker-alt"></i> Biratnagar</button>
                </div>
            </header>

            <!-- Form Section -->
             <div class="product-name">
              Add a product
             </div>
            <section class="form-section">
               
                <form class="product-form">
                    <div class="form-group">
                        <label><i class="fas fa-tag"></i> Product Name</label>
                        <input type="text" placeholder="Product Name">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-dollar-sign"></i> Price</label>
                        <input type="text" placeholder="Price">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-image"></i> Product Image</label>
                        <input type="file" placeholder="Product Image " style="background-color: white;" >
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-sort-amount-up-alt"></i> Quantity</label>
                        <input type="number" placeholder="Quantity">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-apple-alt"></i> Brand</label>
                        <input type="text" placeholder="Brand">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-palette"></i> Color</label>
                        <input type="text" placeholder="Color">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-cubes"></i> Total Quantity</label>
                        <input type="number" placeholder="Total Quantity">
                    </div>
                    <div class="form-group">
                      <button type="submit" class="submit-btn"><i class="fas fa-check"></i> Submit</button>
                    </div>
                    
                </form>
            </section>
        </main>
    </div>
</body>
</html>
