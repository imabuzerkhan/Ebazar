<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="singup.css">
</head>
<body>
    <div class="container">
        <div class="left">
          <a href="index.html">EBOOZAR</a>
            <h2>Welcome to Sign Up</h2>
            <p>Already have an account?</p>
            <a href="singin.html" class="signup-btn">Sign In</a>
        </div>
        <div class="right">
            <div class="social-icons">
                <a href="#"><i class="fab fa-facebook-f"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
            </div>
            <div class="new-right">
                <div class="login-box">
                    <h2>Sign Up</h2>
                    <form>
                        <label for="name">Full Name</label>
                        <input class="input-box" type="text" id="name" placeholder="Full Name" required>

                        <label for="email">Email</label>
                        <input class="input-box" type="email" id="email" placeholder="Email Address" required>

                        <div class="grid">
                          <div class="input-group">
                              <label for="country">Country</label>
                              <input class="input-box" type="text" id="country" placeholder="Country" required>
                          </div>
                          <div class="input-group">
                              <label for="city">City</label>
                              <input class="input-box" type="text" id="city" placeholder="City" required>
                          </div>
                      </div>
                      

                       

                        <label for="phone">Phone Number</label>
                        <input class="input-box" type="tel" id="phone" placeholder="Phone Number" required>

                        <div class="radio-group">
                          <input type="radio" id="buyer" name="role" value="buyer" required>
                            <label for="buyer">Buyer</label>
                            
                            <input type="radio" id="seller" name="role" value="seller" required>
                            <label for="seller">Seller</label>
                            
                        </div>

                        <div class="remember">
                            <input type="checkbox" id="privacy-policy" required>
                            <label for="privacy-policy">I agree to the Privacy Policy</label>
                        </div>

                        <button type="submit" class="signin-btn">Sign Up</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
